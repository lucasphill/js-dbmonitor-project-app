name: Build DBMonitor for Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Test and package Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Package AppImage and Debian package
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: DBMonitor-Linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
