name: Build DBMonitor for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Windows installer and application
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DBMonitor-Setup-Windows-x64
          path: release/DBMonitor Setup *.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked application
        uses: actions/upload-artifact@v7
        with:
          name: DBMonitor-Windows-x64
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 14
