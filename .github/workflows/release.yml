name: Release DBMonitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbmonitor-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
          - platform: Linux-x64
            runner: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Package Windows
        if: matrix.platform == 'Windows-x64'
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package Linux
        if: matrix.platform == 'Linux-x64'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload packages for release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Validate version and packages
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          test -f "release-assets/DBMonitor Setup $version.exe"
          find release-assets -maxdepth 1 -name '*.AppImage' -print -quit | grep -q .
          find release-assets -maxdepth 1 -name '*.deb' -print -quit | grep -q .
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "DBMonitor $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "DBMonitor $RELEASE_TAG"
