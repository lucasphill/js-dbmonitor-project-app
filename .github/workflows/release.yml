name: Release DBMonitor

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: dbmonitor-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check version change and remote tag
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          previous_version=$(git show "$BEFORE_SHA:package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version))")
          if [ "$version" = "$previous_version" ]; then
            echo "package.json version unchanged ($version); skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lock_version=$(node -p "require('./package-lock.json').version")
          lock_root_version=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$version" != "$lock_version" ] || [ "$version" != "$lock_root_version" ]; then
            echo "package-lock.json version does not match package.json ($version)." >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            echo "Tag already exists: $tag. Choose a new package version." >&2
            exit 1
          elif [ "$lookup_status" -eq 2 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not check remote tags (exit $lookup_status)." >&2
            exit "$lookup_status"
          fi

  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
          - platform: Linux-x64
            runner: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Package Windows
        if: matrix.platform == 'Windows-x64'
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package Linux
        if: matrix.platform == 'Linux-x64'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload packages for release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish release
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Validate version and packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "release-assets/DBMonitor Setup $RELEASE_VERSION.exe"
          find release-assets -maxdepth 1 -name '*.AppImage' -print -quit | grep -q .
          find release-assets -maxdepth 1 -name '*.deb' -print -quit | grep -q .

      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --generate-notes --title "DBMonitor $RELEASE_TAG"
